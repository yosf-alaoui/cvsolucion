name: Deploy Production

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      DEPLOY_APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
      DEPLOY_PM2_APP: ${{ secrets.PRODUCTION_PM2_APP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Secrets Audit
        run: pnpm run secrets:audit

      - name: Type Check
        run: pnpm run check

      - name: Production Audit
        run: pnpm run audit:prod

      - name: Build
        run: pnpm run build

      - name: E2E Smoke
        run: pnpm run test:e2e

      - name: Create Release Archive
        run: git archive --format=tar.gz -o "/tmp/cvsolucion-${GITHUB_SHA}.tar.gz" HEAD

      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_APP_DIR"
          test -n "$DEPLOY_PM2_APP"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          HOST_KEYS_FILE="$(mktemp)"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" > "$HOST_KEYS_FILE"; then
              break
            fi
            sleep 2
          done
          test -s "$HOST_KEYS_FILE"
          cat "$HOST_KEYS_FILE" >> ~/.ssh/known_hosts
          rm -f "$HOST_KEYS_FILE"

      - name: Upload Release
        run: |
          PORT="${DEPLOY_PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/id_deploy "/tmp/cvsolucion-${GITHUB_SHA}.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cvsolucion-${GITHUB_SHA}.tar.gz"

      - name: Deploy On Server
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$DEPLOY_APP_DIR' PM2_APP='$DEPLOY_PM2_APP' RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          stage() {
            printf '\n==> %s\n' "$1"
          }

          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "Invalid release SHA" >&2
            exit 1
          fi

          ARCHIVE="/tmp/cvsolucion-${RELEASE_SHA}.tar.gz"
          RELEASES_DIR="$APP_DIR/releases"
          RELEASE="$RELEASES_DIR/$RELEASE_SHA"
          CURRENT_LINK="$APP_DIR/current"
          NEXT_LINK="$APP_DIR/.current-${RELEASE_SHA}"
          PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
          SWITCHED=0
          PM2_BIN="$(command -v pm2 || true)"
          APP_NODE_INTERPRETER="$(command -v node || true)"

          start_pm2_release() {
            config_path="$1"
            if "$PM2_BIN" describe "$PM2_APP" >/dev/null 2>&1; then
              "$PM2_BIN" delete "$PM2_APP"
            fi
            PM2_APP_NAME="$PM2_APP" APP_NODE_INTERPRETER="$APP_NODE_INTERPRETER" \
              "$PM2_BIN" start "$config_path" --only "$PM2_APP" --update-env
          }

          rollback() {
            code=$?
            trap - ERR
            if [ "$SWITCHED" = "1" ]; then
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                rm -f "$NEXT_LINK"
                ln -s "$PREVIOUS_RELEASE" "$NEXT_LINK"
                mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
                start_pm2_release "$CURRENT_LINK/ecosystem.config.cjs" || true
              else
                # First atomic deployment: the legacy app directory is still
                # untouched and remains the rollback target.
                start_pm2_release "$APP_DIR/ecosystem.config.cjs" || true
              fi
              "$PM2_BIN" save || true
            fi
            exit "$code"
          }
          trap rollback ERR

          stage "Validating the remote application layout"
          test -d "$APP_DIR"
          test -f "$APP_DIR/.env"
          test -f "$ARCHIVE"
          mkdir -p "$RELEASES_DIR"

          DATA_DIR="$(grep -E '^APP_DATA_DIR=' "$APP_DIR/.env" | cut -d= -f2- || true)"
          if [ -z "$DATA_DIR" ]; then DATA_DIR="$APP_DIR/data"; fi
          case "$DATA_DIR" in
            /*) ;;
            *) DATA_DIR="$APP_DIR/$DATA_DIR" ;;
          esac

          stage "Preparing immutable release $RELEASE_SHA"
          # RELEASE is constrained to RELEASES_DIR by the validated SHA above.
          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"
          ln -s "$APP_DIR/.env" "$RELEASE/.env"
          rm -rf "$RELEASE/data"
          ln -s "$DATA_DIR" "$RELEASE/data"

          chmod 600 "$APP_DIR/.env"
          find "$DATA_DIR" -type d -exec chmod 700 {} +
          find "$DATA_DIR" -type f \( -name '*.json' -o -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) -exec chmod 600 {} +

          cd "$RELEASE"

          stage "Selecting the Node 24 runtime"
          PINNED_NODE_VERSION="$(tr -d '[:space:]' < .nvmrc)"
          if [ "$PINNED_NODE_VERSION" != "24.20.0" ]; then
            echo "The deployment bootstrap checksum must be updated for Node $PINNED_NODE_VERSION." >&2
            exit 1
          fi
          NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            export NVM_DIR
            set +u
            # shellcheck source=/dev/null
            . "$NVM_DIR/nvm.sh"
            nvm install "$PINNED_NODE_VERSION"
            nvm use "$PINNED_NODE_VERSION"
            set -u
          fi

          if ! node -e "if (process.versions.node !== '$PINNED_NODE_VERSION') process.exit(1)" 2>/dev/null; then
            case "$(uname -m)" in
              x86_64)
                NODE_ARCH="x64"
                NODE_SHA256="855d581f8a4eb1a8117e3426de25fe02770592febcfb31369aee1ffbfee9e8ec"
                ;;
              aarch64|arm64)
                NODE_ARCH="arm64"
                NODE_SHA256="3515603e2487879a39bc75716f1a2affd027500c64ba50e845cf72cb33219013"
                ;;
              *)
                echo "Unsupported server architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac

            RUNTIME_ROOT="$APP_DIR/.runtime"
            NODE_RUNTIME="$RUNTIME_ROOT/node-v${PINNED_NODE_VERSION}-linux-${NODE_ARCH}"
            NODE_ARCHIVE_NAME="node-v${PINNED_NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
            NODE_ARCHIVE="$RUNTIME_ROOT/$NODE_ARCHIVE_NAME"
            NODE_TEMP="$RUNTIME_ROOT/.node-v${PINNED_NODE_VERSION}-linux-${NODE_ARCH}-install"
            if [ ! -x "$NODE_RUNTIME/bin/node" ]; then
              stage "Installing verified Node $PINNED_NODE_VERSION in the application runtime"
              mkdir -p "$RUNTIME_ROOT"
              rm -rf "$NODE_TEMP"
              mkdir -p "$NODE_TEMP"
              curl -fsSLo "$NODE_ARCHIVE" \
                "https://nodejs.org/dist/v${PINNED_NODE_VERSION}/${NODE_ARCHIVE_NAME}"
              printf '%s  %s\n' "$NODE_SHA256" "$NODE_ARCHIVE" | sha256sum -c -
              tar -xzf "$NODE_ARCHIVE" --strip-components=1 -C "$NODE_TEMP"
              mv "$NODE_TEMP" "$NODE_RUNTIME"
              rm -f "$NODE_ARCHIVE"
            fi
            export PATH="$NODE_RUNTIME/bin:$PATH"
          fi

          APP_NODE_INTERPRETER="$(command -v node || true)"
          NODE_VERSION="$(node --version 2>/dev/null || true)"
          echo "Using Node ${NODE_VERSION:-unavailable}"
          if ! node -e "if (process.versions.node !== '$PINNED_NODE_VERSION') process.exit(1)"; then
            echo "Node $PINNED_NODE_VERSION is required for deployment." >&2
            exit 1
          fi
          if ! command -v pnpm >/dev/null 2>&1; then
            corepack enable
            corepack prepare pnpm@10.4.1 --activate
          fi
          if [ -z "$PM2_BIN" ]; then PM2_BIN="$(command -v pm2 || true)"; fi
          if [ -z "$PM2_BIN" ]; then
            echo "PM2 is not available for the deployment user." >&2
            exit 1
          fi

          stage "Installing and verifying the release"
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run secrets:audit
          pnpm run check
          pnpm run audit:prod
          pnpm run build
          pnpm run test:e2e

          # Use SQLite's online backup API instead of archiving a live WAL set.
          pnpm run backup:local
          pnpm run storage:rebuild
          pnpm run storage:health

          EXPECTED_INDEX_MARKER="$(grep -om1 'assets/main-[^"]*\.js' "$RELEASE/dist/public/index.html")"
          if [ -z "$EXPECTED_INDEX_MARKER" ]; then
            echo "Unable to identify the release entry asset." >&2
            exit 1
          fi

          stage "Switching the current release atomically"
          rm -f "$NEXT_LINK"
          ln -s "$RELEASE" "$NEXT_LINK"
          mv -Tf "$NEXT_LINK" "$CURRENT_LINK"
          SWITCHED=1
          start_pm2_release "$CURRENT_LINK/ecosystem.config.cjs"
          "$PM2_BIN" save

          APP_PORT="$(grep -E '^PORT=' "$APP_DIR/.env" | cut -d= -f2- || true)"
          if [ -z "$APP_PORT" ]; then APP_PORT=3000; fi
          HEALTHY=0
          for attempt in 1 2 3 4 5; do
            LIVE_INDEX="$(curl -fsS "http://127.0.0.1:${APP_PORT}/" || true)"
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/auth/me" >/dev/null \
              && [[ "$LIVE_INDEX" == *"$EXPECTED_INDEX_MARKER"* ]]; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" != "1" ]; then
            echo "Production health check failed" >&2
            exit 1
          fi

          stage "Deployment completed successfully"
          SWITCHED=0
          rm -f "$ARCHIVE"
          # Keep the current release plus four prior rollback candidates.
          find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf
          REMOTE
