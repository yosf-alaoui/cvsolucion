# Include inside the HTTPS server/location that proxies CVsolucion.
# Express is the single owner of CSP for proxied responses so it can apply a
# stricter policy to Do Not Track requests. Do not add a second CSP header.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Replace, rather than append to, any client-supplied forwarding chain.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_hide_header X-Powered-By;
